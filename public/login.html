<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BITEL | Iniciar sesión</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
    <link rel="stylesheet" href="/login-assets/login.css">
</head>
<body>
    <main class="login-page">
        <section class="login-card">
            <div class="login-brand">
                <div class="login-logo">BITEL</div>
                <h1>Control de Arrendamientos</h1>
                <p>Acceso al sistema</p>
            </div>

            <form id="loginForm" autocomplete="on">
                <div class="mb-3">
                    <label for="username" class="form-label">Usuario</label>
                    <input
                        type="text"
                        id="username"
                        name="username"
                        class="form-control"
                        autocomplete="username"
                        required
                        autofocus
                    >
                </div>

                <div class="mb-3">
                    <label for="password" class="form-label">Contraseña</label>
                    <input
                        type="password"
                        id="password"
                        name="password"
                        class="form-control"
                        autocomplete="current-password"
                        required
                    >
                </div>

                <div id="loginError" class="alert alert-danger d-none"></div>

                <button id="btnLogin" type="submit" class="btn btn-warning w-100">
                    Iniciar sesión
                </button>
            </form>

            <div class="login-footer">
                Sistema interno BITEL
            </div>
        </section>
    </main>

    <script src="/login-assets/login.js"></script>
</body>
</html>
