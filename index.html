<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>BITEL - Frontend</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.datatables.net/1.13.6/css/dataTables.bootstrap5.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container-fluid px-4 py-4">
        <h3>BITEL | Gestión de Arrendamientos y Adendas</h3>
        
        <!-- Formulario para agregar -->
        <div class="card mb-4 shadow-sm">
            <div class="card-header bg-dark text-white">Nuevo Contrato / Adenda</div>
            <div class="card-body">
                <form id="formContrato">
                    <div class="row">
                        <div class="col-md-2 mb-2"><input type="text" id="codigo" class="form-control" placeholder="Cód BTS (Ej. LAL0308)" required></div>
                        <div class="col-md-3 mb-2"><input type="text" id="propietario" class="form-control" placeholder="Propietario" required></div>
                        <div class="col-md-3 mb-2"><input type="text" id="ubicacion" class="form-control" placeholder="Ubicación" required></div>
                        <div class="col-md-2 mb-2"><input type="date" id="fecha_inicio" class="form-control" required></div>
                        <div class="col-md-2 mb-2"><input type="date" id="fecha_vencimiento" class="form-control" required></div>
                        <div class="col-md-2 mb-2"><input type="number" id="renta" class="form-control" placeholder="Renta S/." required></div>
                        <div class="col-md-2 mb-2">
                            <select id="periodicidad" class="form-control">
                                <option value="Mensual">Mensual</option>
                                <option value="Semestral">Semestral</option>
                                <option value="Anual">Anual</option>
                            </select>
                        </div>
                        <div class="col-md-3 mb-2"><input type="file" id="pdf" class="form-control" accept="application/pdf"></div>
                        <div class="col-md-2 mb-2"><button type="submit" class="btn btn-warning w-100">Guardar</button></div>
                    </div>
                </form>
            </div>
        </div>

        <!-- Tabla -->
        <table id="tablaContratos" class="table table-striped bg-white">
            <thead class="table-dark">
                <tr>
                    <th>Cód</th><th>Propietario</th><th>Vencimiento</th><th>Renta</th><th>Archivo PDF</th>
                </tr>
            </thead>
            <tbody id="cuerpoTabla"></tbody>
        </table>
    </div>

    <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.6/js/dataTables.bootstrap5.min.js"></script>
    <script>
        const API_URL = '/api/contratos';
        let tabla;

        // Cargar datos al abrir
        $(document).ready(function() {
            cargarContratos();
        });

        async function cargarContratos() {
            const respuesta = await fetch(API_URL);
            const datos = await respuesta.json();
            
            let html = '';
            datos.forEach(c => {
                const link = c.pdf_link ? `<a href="${c.pdf_link}" target="_blank" class="btn btn-sm btn-danger">Ver PDF</a>` : 'Sin archivo';
                html += `<tr>
                    <td><strong>${c.codigo}</strong></td>
                    <td>${c.propietario}</td>
                    <td>${c.fecha_vencimiento}</td>
                    <td>S/. ${c.renta} (${c.periodicidad})</td>
                    <td>${link}</td>
                </tr>`;
            });
            
            if (tabla) tabla.destroy();
            document.getElementById('cuerpoTabla').innerHTML = html;
            tabla = $('#tablaContratos').DataTable({ order: [[2, 'asc']] });
        }

        // Guardar nuevo contrato
        document.getElementById('formContrato').addEventListener('submit', async (e) => {
            e.preventDefault();
            const formData = new FormData();
            formData.append('codigo', document.getElementById('codigo').value);
            formData.append('propietario', document.getElementById('propietario').value);
            formData.append('ubicacion', document.getElementById('ubicacion').value);
            formData.append('fecha_inicio', document.getElementById('fecha_inicio').value);
            formData.append('fecha_vencimiento', document.getElementById('fecha_vencimiento').value);
            formData.append('renta', document.getElementById('renta').value);
            formData.append('periodicidad', document.getElementById('periodicidad').value);
            
            const fileInput = document.getElementById('pdf');
            if(fileInput.files[0]) formData.append('documento_pdf', fileInput.files[0]);

            const response = await fetch(API_URL, { method: 'POST', body: formData });
            if (response.ok) {
                alert('Guardado en la base de datos y PDF subido a Drive');
                document.getElementById('formContrato').reset();
                cargarContratos(); // Recargar la tabla
            } else {
                alert('Hubo un error al guardar');
            }
        });
    </script>
</body>
</html>
