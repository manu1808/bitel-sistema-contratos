<!-- ======================================================
     MODAL EDITAR CONTRATO
======================================================= -->

<div
    class="modal fade"
    id="modalEditar"
    tabindex="-1"
>

    <div class="modal-dialog modal-lg">

        <div class="modal-content">


            <div class="modal-header">

                <h5 class="modal-title">
                    Editar contrato
                </h5>

                <button
                    type="button"
                    class="btn-close btn-close-white"
                    data-bs-dismiss="modal"
                ></button>

            </div>


            <div class="modal-body">

                <input
                    type="hidden"
                    id="editar_id"
                >


                <div class="row">

                    <div class="col-md-4 mb-3">

                        <label class="form-label">
                            Código BTS
                        </label>

                        <input
                            id="editar_codigo"
                            class="form-control"
                        >

                    </div>


                    <div class="col-md-8 mb-3">

                        <label class="form-label">
                            Propietario
                        </label>

                        <input
                            id="editar_propietario"
                            class="form-control"
                        >

                    </div>


                    <div class="col-md-12 mb-3">

                        <label class="form-label">
                            Ubicación
                        </label>

                        <input
                            id="editar_ubicacion"
                            class="form-control"
                        >

                    </div>


                    <div class="col-md-3 mb-3">

                        <label class="form-label">
                            Fecha inicio
                        </label>

                        <input
                            type="date"
                            id="editar_fecha_inicio"
                            class="form-control"
                        >

                    </div>


                    <div class="col-md-3 mb-3">

                        <label class="form-label">
                            Vencimiento
                        </label>

                        <input
                            type="date"
                            id="editar_fecha_vencimiento"
                            class="form-control"
                        >

                    </div>


                    <div class="col-md-3 mb-3">

                        <label class="form-label">
                            Renta
                        </label>

                        <input
                            type="number"
                            step="0.01"
                            id="editar_renta"
                            class="form-control"
                        >

                    </div>


                    <div class="col-md-3 mb-3">

                        <label class="form-label">
                            Periodicidad
                        </label>

                        <select
                            id="editar_periodicidad"
                            class="form-select"
                        >

                            <option>Mensual</option>
                            <option>Semestral</option>
                            <option>Anual</option>

                        </select>

                    </div>

                </div>

            </div>


            <div class="modal-footer">

                <button
                    class="btn btn-secondary"
                    data-bs-dismiss="modal"
                >
                    Cancelar
                </button>

                <button
                    class="btn btn-warning"
                    onclick="guardarEdicion()"
                >
                    Guardar cambios
                </button>

            </div>

        </div>

    </div>

</div>
