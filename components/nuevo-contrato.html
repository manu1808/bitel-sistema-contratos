<!-- ======================================================
     NUEVO CONTRATO
======================================================= -->

<div class="card shadow-sm mb-4">

    <div class="card-header bg-dark text-white">

        Nuevo Contrato

    </div>


    <div class="card-body">

        <form id="formContrato">

            <div class="row">


                <div class="col-md-2 mb-3">

                    <label class="form-label">
                        Código BTS
                    </label>

                    <input
                        type="text"
                        id="codigo"
                        class="form-control"
                        placeholder="Ej. LAL0308"
                        required
                    >

                </div>


                <div class="col-md-3 mb-3">

                    <label class="form-label">
                        Propietario
                    </label>

                    <input
                        type="text"
                        id="propietario"
                        class="form-control"
                        required
                    >

                </div>


                <div class="col-md-3 mb-3">

                    <label class="form-label">
                        Ubicación
                    </label>

                    <input
                        type="text"
                        id="ubicacion"
                        class="form-control"
                    >

                </div>


                <div class="col-md-2 mb-3">

                    <label class="form-label">
                        Inicio
                    </label>

                    <input
                        type="date"
                        id="fecha_inicio"
                        class="form-control"
                    >

                </div>


                <div class="col-md-2 mb-3">

                    <label class="form-label">
                        Vencimiento
                    </label>

                    <input
                        type="date"
                        id="fecha_vencimiento"
                        class="form-control"
                    >

                </div>


                <div class="col-md-2 mb-3">

                    <label class="form-label">
                        Renta S/.
                    </label>

                    <input
                        type="number"
                        step="0.01"
                        id="renta"
                        class="form-control"
                    >

                </div>


                <div class="col-md-2 mb-3">

                    <label class="form-label">
                        Periodicidad
                    </label>

                    <select
                        id="periodicidad"
                        class="form-select"
                    >

                        <option value="Mensual">
                            Mensual
                        </option>

                        <option value="Semestral">
                            Semestral
                        </option>

                        <option value="Anual">
                            Anual
                        </option>

                    </select>

                </div>


                <div class="col-md-5 mb-3">

                    <label class="form-label">
                        Contrato primigenio
                    </label>

                    <input
                        type="file"
                        id="pdf"
                        class="form-control"
                        accept="application/pdf"
                    >

                </div>


                <div class="col-md-3 mb-3 d-flex align-items-end">

                    <button type="submit" id="btnGuardar" class="btn btn-warning w-100">
    💾 Guardar
</button>

                </div>


            </div>

            <div id="estadoCarga" class="mt-3 d-none">
                <div class="d-flex justify-content-between mb-1">
                    <span id="textoEstado" class="fw-semibold">
                        Procesando...
                    </span>
                    <span id="porcentaje">0%</span>
                </div>

                <div class="progress" style="height: 22px;">
                    <div
                        id="barraProgreso"
                        class="progress-bar progress-bar-striped progress-bar-animated"
                        role="progressbar"
                        style="width: 0%">
                    </div>
                </div>
            </div>

        </form>

    </div>

</div>
