<!-- ======================================================
     MODAL PAGOS
======================================================= -->

<div
    class="modal fade"
    id="modalPagos"
    tabindex="-1"
>

    <div class="modal-dialog modal-xl">

        <div class="modal-content">


            <div class="modal-header">

                <h5 class="modal-title">
                    Seguimiento de pagos
                </h5>

                <button
                    class="btn-close btn-close-white"
                    data-bs-dismiss="modal"
                ></button>

            </div>


            <div class="modal-body">

                <div id="infoContratoPago"></div>


                <div class="table-responsive">

                    <table class="table table-bordered">

                        <thead>

                            <tr>

                                <th>Fecha programada</th>

                                <th>Fecha de pago</th>

                                <th>Monto</th>

                                <th>Estado</th>

                                <th>Observación</th>

                                <th></th>

                            </tr>

                        </thead>

                        <tbody id="tablaPagos"></tbody>

                    </table>

                </div>


                <hr>


                <h6>
                    Registrar seguimiento
                </h6>


                <form id="formPago">

                    <input
                        type="hidden"
                        id="pago_contrato_id"
                    >


                    <div class="row">

                        <div class="col-md-3">

                            <label class="form-label">
                                Fecha programada
                            </label>

                            <input
                                type="date"
                                id="fecha_programada"
                                class="form-control"
                                required
                            >

                        </div>


                        <div class="col-md-3">

                            <label class="form-label">
                                Fecha real de pago
                            </label>

                            <input
                                type="date"
                                id="fecha_pago"
                                class="form-control"
                            >

                        </div>


                        <div class="col-md-2">

                            <label class="form-label">
                                Monto
                            </label>

                            <input
                                type="number"
                                step="0.01"
                                id="monto_pago"
                                class="form-control"
                            >

                        </div>


                        <div class="col-md-2">

                            <label class="form-label">
                                Estado
                            </label>

                            <select
                                id="estado_pago"
                                class="form-select"
                            >

                                <option value="PENDIENTE">
                                    Pendiente
                                </option>

                                <option value="PAGADO">
                                    Pagado
                                </option>

                            </select>

                        </div>


                        <div class="col-md-12 mt-3">

                            <label class="form-label">
                                Observación
                            </label>

                            <input
                                id="observacion_pago"
                                class="form-control"
                            >

                        </div>


                        <div class="col-md-12 mt-3">

                            <button
                                class="btn btn-warning"
                                type="submit"
                            >
                                Registrar seguimiento
                            </button>

                        </div>

                    </div>

                </form>

            </div>

        </div>

    </div>

</div>
